<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
    <style>
        .party-container {
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
            100% { box-shadow: 0 0 40px rgba(255, 105, 180, 0.5); }
        }
        .person-name {
            font-size: 1.5rem !important;
            color: #ffd700;
            font-weight: 700;
            margin: 5px 0;
        }
        .dialogue-text {
            font-size: 1.05rem;
            color: #ffecd2;
            line-height: 1.6;
            margin: 10px 0;
            font-style: italic;
        }
        .reply-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .reply-btn {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .reply-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ffd700, #ff9900);
            color: #1a0b2e;
        }
    </style>
</head>

        <span class="name-highlight" id="subHighlight">আরামসে দেখে নাও কে কে কেক খাচ্ছে... 🎉</span>

        <!-- Live Stage / Dialogue Box -->
        <div class="target-box" id="targetBox">
            <div id="avatarIcon" class="avatar-icon">🎊</div>
            <div id="currentPersonName" class="person-name">পার্টি শুরু করতে নিচের বাটনে চাপো!</div>
            <div id="eatingStatus" class="eating-status"></div>
            <div id="dialogueContainer"></div>

        <!-- Dynamic Reply Options for ESA -->

        <div style="margin: 15px 0;" id="actionArea">
            <button class="action-btn" id="startPartyBtn" onclick="startAutoParty()" style="width: 100%; font-size: 1.1rem; padding: 14px;">
                🎉 কেক খাওয়ানো শুরু করো 🔪
            </button>
        </div>

        <div class="sender-tag">
            With Best Wishes, <br><span style="color: #ffd700; font-size: 1.1rem; font-family: 'Great Vibes', cursive;">Anas</span>
        </div>

        <div class="nav-btns" style="margin-top: 15px;">
            <button class="action-btn prev-btn" onclick="goBackToStory()">⬅️ পিছে যাও</button>
            <button class="action-btn" onclick="goToStart()">শুরুতে ফিরে যাও ↺</button>
        </div>

    </div>

        <span>🎵 বাজছে: আমার মনে জোছনা আমি কাউকে দিবে না</span>
    </div>

        let currentIndex = 0;
        let partyInterval = null;
        let stage = 'cake'; // 'cake' প্রথমে, পরে 'dialogue'

        window.onload = function() {
            const music = document.getElementById('bgMusic');
            const musicBar = document.getElementById('musicBar');
            if (localStorage.getItem('playMusic') === 'true') {
                music.play().catch(e => console.log(e));
                musicBar.style.display = 'flex';
            }
        };

        const bgEffects = document.getElementById('bgEffects');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 5 + 3 + 'px';
            particle.style.width = size;
            particle.style.height = size;
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
            particle.style.animationDelay = (Math.random() * 5) + 's';
            bgEffects.appendChild(particle);
        }

        function startAutoParty() {
            document.getElementById('startPartyBtn').style.display = 'none';
            currentIndex = 0;
            stage = 'cake';
            runPartyLoop();
            partyInterval = setInterval(runPartyLoop, 3800);
        }

        function runPartyLoop() {
            if (stage === 'cake') {
                if (currentIndex < guests.length) {
                    const guest = guests[currentIndex];
                    let emoji = "👧 🍰";
                    if (guest.type === "boy") emoji = "👦 🍰";
                    if (guest.type === "old") emoji = "👴 🍰";

                    document.getElementById('avatarIcon').innerHTML = `<span style="display:inline-block; animation: chewAnim 0.6s infinite alternate;">${emoji}</span>`;
                    document.getElementById('currentPersonName').innerText = guest.name;
                    document.getElementById('eatingStatus').innerText = guest.msg;
                    document.getElementById('dialogueContainer').innerHTML = "";
                    document.getElementById('subHighlight').innerText = `✨ কেক খাচ্ছেন: (${currentIndex + 1} / ${guests.length}) ✨`;

                    currentIndex++;
                } else {
                    // কেক খাওয়া শেষ, এখন ডায়লগ বা কথা বলার পর্বে চলে যাব
                    clearInterval(partyInterval);
                    stage = 'dialogue';
                    currentIndex = 0;
                    document.getElementById('topHeader').innerText = "💬 Special Conversation";
                    document.getElementById('mainTitle').innerText = "সবার মিষ্টি কথা ও শুভেচ্ছা!";
                    document.getElementById('subHighlight').innerText = "এবার একে একে সবাই কথা বলবে এবং তুমি উত্তর দেবে 👇";
                    startDialoguePhase();
                }
            }
        }

        function startDialoguePhase() {
            if (currentIndex < conversations.length) {
                const item = conversations[currentIndex];
                let emoji = "👧";
                if (item.type === "boy") emoji = "👦";
                if (item.type === "old") emoji = "👴";

                document.getElementById('avatarIcon').innerText = emoji;
                document.getElementById('currentPersonName').innerText = item.name;
                document.getElementById('eatingStatus').innerText = "";
                document.getElementById('dialogueContainer').innerHTML = `<div class="dialogue-text">"${item.dialogue}"</div>`;

                // অপশন বাটনগুলো তৈরি করা
                let replyHtml = "";
                item.options.forEach((opt, idx) => {
                    replyHtml += `<button class="reply-btn" onclick="selectReply(${idx})">${opt.text}</button>`;
                });
                document.getElementById('replyOptions').innerHTML = replyHtml;
            } else {
                // সব কথা বলা শেষ
                document.getElementById('avatarIcon').innerText = "💖🥳🎂";
                document.getElementById('currentPersonName').innerText = "আমাদের অনুষ্ঠান এতটুকুই! ✨";
                document.getElementById('dialogueContainer').innerHTML = `<div class="dialogue-text">"সবাই মিলে তোর ১৭তম জন্মদিনটা অনেক সুন্দরভাবে সেলিব্রেট করল। সারাজীবন এভাবেই আনন্দে থেকো ESA Chowdhury!" 💫</div>`;
                document.getElementById('replyOptions').innerHTML = `<button class="action-btn" onclick="goToStart()" style="padding: 10px 20px;">সবাইকে অনেক ধন্যবাদ! ↺</button>`;
            }
        }

        function selectReply(optionIndex) {
            const item = conversations[currentIndex];
            const chosenOption = item.options[optionIndex];

            // উত্তরের ফল দেখানো
            document.getElementById('dialogueContainer').innerHTML = `
                <div class="dialogue-text" style="color: #ffd700;">তুমি বললে: "${chosenOption.text}"</div>
                <div class="dialogue-text" style="color: #ff9a9e; margin-top: 5px;">${chosenOption.response}</div>
            `;
            document.getElementById('replyOptions').innerHTML = `<button class="action-btn" onclick="nextDialogue()" style="padding: 8px 20px; font-size: 0.95rem;">পরের জনের কথা শুনো ➔</button>`;
        }

        function nextDialogue() {
            currentIndex++;
            startDialoguePhase();
        }

        function goBackToStory() {
            clearInterval(partyInterval);
            window.location.href = "story.html";
        }

        function goToStart() {
            clearInterval(partyInterval);
            window.location.href = "index.html";
        }

        function togglePlayMusic() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('playPauseBtn');
            if (music.paused) {
                music.play();
                btn.innerHTML = "⏸";
            } else {
                music.pause();
                btn.innerHTML = "▶";
            }
        }
    </script>
</body>
</html>
